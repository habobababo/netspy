<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NetWatch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232fbf71'/><circle cx='16' cy='16' r='6' fill='%230e1116'/></svg>">
<style>
:root{
  --bg:#0e1116;--panel:#161a21;--panel2:#1b2029;--line:#252b35;--text:#e8ebf0;--mute:#8a93a3;--mute2:#5f6878;
  --on:#2fbf71;--off:#e5484d;--acc:#4c8dff;--warn:#f0b429;--radius:12px;
  --down:#4c8dff;--up:#c4781c;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root{--bg:#f4f6f9;--panel:#fff;--panel2:#f7f8fa;--line:#e3e7ee;--text:#151a22;--mute:#5f6878;--mute2:#9aa3b2;--down:#2f6fe0;--up:#c4740f}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.mute{color:var(--mute)}
.hidden{display:none!important}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--on);box-shadow:0 0 8px var(--on)}
.topnav{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.topnav a{color:var(--mute);text-decoration:none;padding:6px 14px;border-radius:7px;font-weight:500}
.topnav a.active{background:var(--panel2);color:var(--text)}
.spacer{flex:1}
.ibtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
.ibtn:hover{border-color:var(--acc)}
.ibtn svg{width:16px;height:16px}
.ibtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Layout ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:14px 16px 40px}
.alerts>div{padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:13px}
.a-err{background:color-mix(in srgb,var(--off) 15%,transparent);border:1px solid color-mix(in srgb,var(--off) 50%,transparent)}
.a-warn{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:12px;color:var(--mute)}
.stat.on b{color:var(--on)}.stat.off b{color:var(--off)}

.vlans{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.vlans::-webkit-scrollbar{display:none}
.vchip{flex:0 0 auto;min-width:110px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left}
.vchip.active{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--panel))}
.vchip .t{font-weight:600;white-space:nowrap}
.vchip .s{font-size:12px;color:var(--mute);white-space:nowrap}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--on)}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font:inherit;padding:9px 0;min-width:0}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg button{background:none;border:none;padding:6px 10px;border-radius:7px;color:var(--mute);cursor:pointer;white-space:nowrap}
.seg button.active{background:var(--panel2);color:var(--text)}
select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 10px;font:inherit}

.group{margin-bottom:16px}
.ghead{display:flex;align-items:baseline;gap:10px;padding:6px 4px}
.ghead h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.ghead span{font-size:12px;color:var(--mute)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:grid;grid-template-columns:14px minmax(0,2.2fr) 130px minmax(0,1.6fr) 112px 90px 34px;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row:hover{background:var(--panel2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--off);opacity:.85;flex:0 0 auto}
.dot.on{background:var(--on);box-shadow:0 0 6px var(--on);opacity:1}
.nm{min-width:0}
.nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm b.unnamed{color:var(--mute);font-weight:500;font-style:italic}
.nm small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seen{color:var(--mute);font-size:12.5px;text-align:right;white-space:nowrap}
.bell{background:none;border:none;cursor:pointer;padding:4px;border-radius:8px;opacity:.3;font-size:16px;line-height:1;filter:grayscale(1)}
.bell.on{opacity:1;filter:none}
.empty{padding:28px;text-align:center;color:var(--mute)}
.a-info{background:color-mix(in srgb,var(--acc) 10%,transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}

/* ---------- Traffic ---------- */
.rate{font-size:12px;line-height:1.35;white-space:nowrap;text-align:right;color:var(--text)}
.rate i{font-style:normal;color:var(--mute);display:inline-block;width:12px;text-align:center}
.rate.idle{color:var(--mute2)}
.talert{color:var(--warn)}
.tsec{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.thead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.legend b{color:var(--text);font-weight:600}
.sw2{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sw2.dn{background:var(--down)}.sw2.up{background:var(--up)}
.chart{position:relative;margin:6px 0 4px}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--mute);font-size:10.5px;font-family:inherit}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:hover{fill:color-mix(in srgb,var(--text) 6%,transparent)}
.tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:5;display:none}
.tip b{display:block;margin-bottom:2px}
.tsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.tsum div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12px}
.tsum span{display:block;color:var(--mute);font-size:11px}
details.ttab{margin-top:8px;font-size:12.5px}
details.ttab summary{cursor:pointer;color:var(--mute)}
details.ttab table{width:100%;border-collapse:collapse;margin-top:6px}
details.ttab td,details.ttab th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:right}
details.ttab td:first-child,details.ttab th:first-child{text-align:left}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.trow{display:grid;grid-template-columns:26px minmax(0,1.6fr) minmax(0,2fr) 92px 92px;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow.click{cursor:pointer}.trow.click:hover{background:var(--panel2)}
.trow .rk{color:var(--mute);font-size:12px;text-align:right}
.trow .v{text-align:right;font-size:12.5px;white-space:nowrap}
.trow .v small{display:block;color:var(--mute);font-size:11px}
.hbar2{display:flex;gap:2px;height:8px;min-width:0}
.hbar2 i{display:block;height:100%;border-radius:2px}
.hbar2 .dn{background:var(--down)}.hbar2 .up{background:var(--up)}
.thdr{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;padding:8px 14px;border-bottom:1px solid var(--line)}
.thdr .v{text-transform:none}

.day{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;padding:10px 4px 6px}
.ev{display:grid;grid-template-columns:52px 92px minmax(0,1fr) 22px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:none}
.ev time{color:var(--mute);font-size:12.5px}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--line);color:var(--mute);text-align:center;white-space:nowrap}
.b-new{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--acc)}
.b-online{background:color-mix(in srgb,var(--on) 18%,transparent);color:var(--on)}
.b-offline{background:color-mix(in srgb,var(--off) 18%,transparent);color:var(--off)}
.b-macchange,.b-vlanchange{background:color-mix(in srgb,#a78bfa 20%,transparent);color:#a78bfa}
.b-traffic{background:color-mix(in srgb,var(--up) 20%,transparent);color:var(--up)}
.b-ipchange{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.ev .txt{min-width:0}
.ev .txt b{font-weight:600}
.ev .txt small{display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.tg{text-align:center}
.tg-ok{color:var(--on)}.tg-err{color:var(--off)}.tg-wait{color:var(--warn)}.tg-none{color:var(--mute2)}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:50%;top:50%;width:min(520px,94vw);max-height:90vh;overflow:auto;transform:translate(-50%,-46%);opacity:0;pointer-events:none;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;transition:.2s}
.sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.sheet h2{margin:0 0 2px;font-size:18px;display:flex;align-items:center;gap:8px}
.sheet .sub{color:var(--mute);margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);font:inherit;font-size:16px}
.field input:focus{outline:none;border-color:var(--acc)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:14px 0;font-size:13.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-all}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.toggle small{display:block;color:var(--mute)}
.sw{position:relative;width:44px;height:26px;flex:0 0 auto}
.sw input{display:none}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:26px;cursor:pointer;transition:.15s}
.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--acc)}.sw input:checked+span:before{transform:translateX(18px)}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--off)}
.checkres{margin-top:10px;font-size:13.5px}

.bnav{display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  .row{grid-template-columns:12px minmax(0,1fr) auto 30px;gap:10px;padding:12px}
  .row .ipc,.row .conn,.row .rate,.nm small.d{display:none}
  .trow{grid-template-columns:20px minmax(0,1fr) 78px 78px;padding:9px 12px}
  .trow .hbar2{grid-column:2/5;grid-row:2}
  .thdr span:nth-child(3){display:none}
  .tsum{grid-template-columns:repeat(2,1fr)}
  .stats{gap:6px}
  .stat{padding:8px 10px}.stat b{font-size:18px}.stat span{font-size:11px}
  .topnav,.hlabel{display:none}
  .hbar{padding:10px 12px}
  .wrap{padding:12px 12px calc(84px + var(--safe-b))}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
  .bnav a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font-size:11.5px;padding:4px 0}
  .bnav a svg{display:block;margin:0 auto 2px;width:22px;height:22px}
  .bnav a.active{color:var(--acc)}
  .toast{bottom:calc(80px + var(--safe-b))}
  .sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:88vh;transform:translateY(100%);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + var(--safe-b));opacity:1}
  .sheet.open{transform:translateY(0)}
  .sheet:before{content:"";display:block;width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 12px}
  .ev{grid-template-columns:44px minmax(0,1fr) 20px;padding:10px 12px}
  .ev .bdg{display:none}
  .ev .txt .bm{display:inline-block;margin-right:6px}
  .kv{grid-template-columns:105px 1fr}
  .tools select{flex:1}
}
@media (min-width:821px){.nm small.m{display:none}.ev .txt .bm{display:none}}
@media (forced-colors:active){.sw2,.hbar2 i{forced-color-adjust:none}}

  /* Netzwerk */
  #net .ntools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  #net .ntools .ibtn { padding: 6px 11px; font-size: 13.5px; }
  #net .ntools .ibtn.on { background: var(--acc); color: #fff; border-color: var(--acc); }
  #net .ntools label.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; color: var(--mute); margin-left: 4px; cursor: pointer; }
  #net .nhint { font-size: 13px; color: var(--mute); margin: 0 0 8px; }
  #net .nhint.w { color: var(--warn); }
  .nwrap { position: relative; height: max(440px, calc(100dvh - 190px)); background: var(--panel); border: 1px solid var(--line);
           border-radius: 12px; overflow: hidden; }
  .nwrap.connect { outline: 2px dashed var(--acc); outline-offset: -2px; }
  #nsvg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  #nsvg.panning { cursor: grabbing; }
  .nzoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
  .nzoom button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2);
                  color: var(--text); font: 600 17px/1 inherit; cursor: pointer; }
  .nlegend { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; color: var(--mute); display: flex; gap: 12px;
             flex-wrap: wrap; pointer-events: none; }
  .nlegend svg { vertical-align: middle; margin-right: 4px; }
  .nn rect.b { fill: var(--panel2); stroke: var(--line); stroke-width: 1.2; }
  .nn:hover rect.b, .nn.sel rect.b { stroke: var(--acc); stroke-width: 2; }
  .nn.src rect.b { stroke: var(--acc); stroke-width: 2.5; stroke-dasharray: 5 3; }
  .nn text { fill: var(--text); font-size: 13px; }
  .nn text.s { fill: var(--mute); font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .nn text.i { font-size: 17px; }
  .nn .badge { fill: var(--acc); }
  .nn text.bt { fill: #fff; font-size: 10.5px; font-weight: 700; }
  .nn.up circle.st { fill: var(--on); } .nn.down circle.st { fill: var(--off); } .nn circle.st { fill: var(--mute2); }
  .nn.down text { opacity: .6; }
  .nn.dim, .ne.dim { opacity: .2; }
  .nn.hid, .ne.hid { opacity: .35; }
  .nn { cursor: pointer; }
  .ne path.l { fill: none; stroke: var(--mute); stroke-width: 1.8; }
  .ne.wifi path.l { stroke: var(--acc); stroke-dasharray: 6 5; }
  .ne.virtual path.l { stroke: var(--mute2); stroke-width: 1.3; stroke-dasharray: 2 4; }
  .ne.net path.l { stroke: var(--line); stroke-width: 1.6; }
  .ne.manual path.l { stroke: var(--warn); }
  .ne.manual.wifi path.l { stroke: var(--warn); }
  .ne path.hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
  .ne:hover path.l { stroke-width: 3; }
  .ne text { fill: var(--mute); font-size: 10.5px; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
  #ndlg .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; margin: 4px 0 6px; }
  #ndlg .kv span:nth-child(odd) { color: var(--mute); }
  #ndlg .kv span { overflow-wrap: anywhere; }
  #ndlg ul { margin: 4px 0; padding-left: 18px; font-size: 13.5px; }
  #ndlg select, #ndlg textarea { width: 100%; }
  #ndlg textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 60px; }
  
  #net .nsearch { flex: 1 1 200px; max-width: 280px; }
  #ndlg { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--text); padding: 18px;
          width: min(480px, 94vw); max-height: 90vh; overflow: auto; }
  #ndlg::backdrop { background: rgba(0,0,0,.5); }
  #ndlg h3 { margin: 0 0 10px; font-size: 18px; }
  #ndlg label { display: block; font-size: 12px; color: var(--mute); margin: 10px 0 4px; }
  #ndlg input, #ndlg select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
          padding: 10px 12px; color: var(--text); font: inherit; font-size: 15px; }
  #ndlg textarea { background: var(--bg); padding: 10px 12px; border-radius: 10px; }
  #ndlg .kv { display: grid; grid-template-columns: auto 1fr; }
  #ndlg .nrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  #ndlg .nrow .btn { flex: 1 1 auto; padding: 9px 12px; }
  @media (max-width: 820px) {
    .nwrap { height: calc(100dvh - 230px - var(--safe-b)); min-height: 360px; }
    #net .nsearch { max-width: none; flex-basis: 100%; }
    #ndlg input, #ndlg select, #ndlg textarea { font-size: 16px; }
    .nlegend { display: none; }
  }

</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="logo"><i></i>NetWatch</div>
    <nav class="topnav">
      <a href="#/" data-nav="dev">Geräte</a>
      <a href="#/traffic" data-nav="tr">Traffic</a>
      <a href="#/events" data-nav="ev">Ereignisse</a>
      <a href="#/net" data-nav="net">Netz</a>
    </nav>
    <div class="spacer"></div>
    <span class="mute" id="lastscan" style="font-size:12px"></span>
    <button class="ibtn" id="scanbtn" onclick="scanNow()" title="Jetzt scannen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span class="hlabel">Scannen</span>
    </button>
    <button class="ibtn" onclick="tgTest()" title="Telegram testen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M22 3 2 11l7 3 3 7 10-18z"/><path d="m9 14 13-11"/></svg><span class="hlabel">Test</span>
    </button>
  </div>
</header>

<div class="wrap">
  <div class="alerts" id="alerts"></div>

  <section id="page-dev">
    <div class="stats" id="stats"></div>
    <div class="vlans" id="vlans"></div>
    <div class="tools">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--mute)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Name, IP, MAC, Hersteller …" oninput="render()">
      </label>
      <div class="seg" id="filters">
        <button data-f="all" class="active">Alle</button>
        <button data-f="on">Online</button>
        <button data-f="off">Offline</button>
        <button data-f="unnamed">Unbenannt</button>
        <button data-f="watch">🔔</button>
      </div>
      <select id="sort" onchange="render()">
        <option value="ip">Sortierung: IP</option>
        <option value="name">Sortierung: Name</option>
        <option value="status">Sortierung: Status</option>
        <option value="seen">Sortierung: zuletzt gesehen</option>
        <option value="first">Sortierung: neueste zuerst</option>
      </select>
    </div>
    <div id="groups"></div>
  </section>

  <section id="page-tr" class="hidden">
    <div class="tools">
      <div class="seg" id="trng">
        <button data-r="live">Live</button>
        <button data-r="today">Heute</button>
        <button data-r="24h" class="active">24 h</button>
        <button data-r="7d">7 Tage</button>
        <button data-r="30d">30 Tage</button>
      </div>
      <select id="tvlan" onchange="loadTraffic()"><option value="">Alle VLANs</option></select>
    </div>
    <div class="alerts" id="talerts"></div>
    <div class="stats" id="tstats"></div>
    <div class="card" id="tchartcard"><div class="thead"><h3 style="margin:0">Verlauf</h3><div class="legend" id="tlegend"></div></div><div id="tchart2" class="chart"></div></div>
    <div class="group" id="tvlanbox"><div class="ghead"><h3>Pro VLAN</h3><span id="tvlansub"></span></div><div class="list" id="tvlans"></div></div>
    <div class="group"><div class="ghead"><h3>Top-Verbraucher</h3><span id="ttopsub"></span></div><div class="list" id="ttop"></div></div>
    <p class="mute" style="font-size:12px;margin:14px 4px 0">ℹ️ Die Firewall sieht nur Verkehr, der über sie läuft – ins Internet und zwischen VLANs.
      Verkehr zwischen zwei Geräten im <b>selben</b> VLAN (z. B. NAS ↔ PC im gleichen Netz) taucht hier nicht auf.
      <span id="tsrc"></span></p>

  <section id="page-ev" class="hidden">
    <div class="tools">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--mute)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="eq" type="search" placeholder="Gerät, IP, Text …" oninput="renderEvents()">
      </label>
      <div class="seg" id="ekinds">
        <button data-k="" class="active">Alle</button>
        <button data-k="new">Neu</button>
        <button data-k="online">Online</button>
        <button data-k="offline">Offline</button>
        <button data-k="ipchange">IP</button>
        <button data-k="macchange">MAC</button>
        <button data-k="vlanchange">VLAN</button>
        <button data-k="traffic">Traffic</button>
      </div>
      <select id="evlan" onchange="renderEvents()"><option value="">Alle VLANs</option></select>
      <select id="elimit" onchange="loadEvents()">
        <option value="100">letzte 100</option><option value="300" selected>letzte 300</option><option value="1000">letzte 1000</option><option value="5000">letzte 5000</option>
      </select>
    </div>
    <div id="egroups"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
      <span class="mute" id="ecount" style="font-size:12px"></span>
      <button class="ibtn" onclick="clearEvents()">Ereignisse löschen</button>
    </div>
  </section>

  <section id="page-net" class="hidden"></section>
</div>
<dialog id="ndlg"></dialog>

<div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<nav class="bnav">
  <a href="#/" data-nav="dev">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Geräte
  </a>
  <a href="#/traffic" data-nav="tr">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20V5M3 9l4-4 4 4"/><path d="M17 4v15M13 15l4 4 4-4"/></svg>Traffic
  </a>
  <a href="#/events" data-nav="ev">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Ereignisse
  </a>
  <a href="#/net" data-nav="net">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/></svg>Netz
  </a>
</nav>
<div class="toast" id="toast"></div>

<script>
let S = null, E = [], curVlan = localStorage.getItem("nw_vlan") ?? "all", filter = "all", ekind = "", openId = null;
let T = null, trng = localStorage.getItem("nw_trng") || "24h", srng = "24h";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ipNum = ip => (ip || "0.0.0.0").split(".").reduce((a, b) => a * 256 + (+b || 0), 0);
const ago = ts => {
  if (!ts) return "nie";
  const s = Date.now() / 1000 - ts;
  if (s < 90) return "gerade";
  if (s < 3600) return Math.round(s / 60) + " min";
  if (s < 86400) return Math.round(s / 3600) + " h";
  if (s < 86400 * 7) return Math.round(s / 86400) + " Tg";
  return new Date(ts * 1000).toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"});
};
const dt = ts => ts ? new Date(ts * 1000).toLocaleString("de-DE", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "–";
const dname = d => d.name || (S && S.unifi_names && d.unifi_name) || d.hostname || "";
const nf1 = new Intl.NumberFormat("de-DE", {maximumFractionDigits: 1}), nf0 = new Intl.NumberFormat("de-DE", {maximumFractionDigits: 0});
const fmtB = n => {
  n = +n || 0;
  if (n < 1000) return Math.round(n) + " B";
  const u = ["kB", "MB", "GB", "TB"]; let i = -1;
  do { n /= 1000; i++; } while (n >= 1000 && i < u.length - 1);
  return (n < 100 ? nf1 : nf0).format(n) + " " + u[i];
};
const fmtR = n => fmtB(n) + "/s";
const toast = t => { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2600); };
async function api(url, body, method = "POST") {
  return fetch(url, {method, headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
}

async function load() {
  try {
    S = await (await fetch("api/state")).json();
    render();
    if (openId !== null) { refreshSheet(); updateSheetRate(); }
  } catch (e) { $("lastscan").textContent = "keine Verbindung"; }
}

/* ---------- Geräte ---------- */
function render() {
  if (!S) return;
  const all = S.devices, on = all.filter(d => d.online).length;
  const unnamed = all.filter(d => !d.name).length;
  $("lastscan").textContent = "Scan " + ago(S.last_scan);

  $("alerts").innerHTML =
      (S.last_error ? `<div class="a-err"><b>OPNsense:</b> ${esc(S.last_error)}</div>` : "")
    + (S.unifi_error ? `<div class="a-err"><b>UniFi:</b> ${esc(S.unifi_error)}</div>` : "")
    + (S.tg_error ? `<div class="a-err"><b>Telegram:</b> ${esc(S.tg_error)}</div>` : "")
    + (S.traffic && S.traffic.error ? `<div class="a-err"><b>Traffic:</b> ${esc(S.traffic.error)}</div>` : "")
    + (!S.telegram ? `<div class="a-warn">Telegram ist nicht konfiguriert (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID).</div>` : "");

  $("stats").innerHTML = `
    <div class="stat on"><b>${on}</b><span>online</span></div>
    <div class="stat off"><b>${all.length - on}</b><span>offline</span></div>
    <div class="stat"><b>${all.length}</b><span>Geräte</span></div>
    <div class="stat"><b>${unnamed}</b><span>unbenannt</span></div>`;

  const chips = [{id:"all", label:"Alle", online:on, total:all.length}, ...S.vlans];
  if (!chips.some(c => String(c.id) === String(curVlan))) curVlan = "all";
  $("vlans").innerHTML = chips.map(c => `
    <button class="vchip ${String(c.id) === String(curVlan) ? "active" : ""}" onclick="selVlan('${c.id}')">
      <div class="t">${esc(c.label)}</div>
      <div class="s">${c.online}/${c.total} online</div>
      <div class="bar"><i style="width:${c.total ? Math.round(c.online / c.total * 100) : 0}%"></i></div>
    </button>`).join("");

  const evSel = $("evlan");
  if (evSel.options.length <= 1) evSel.innerHTML = `<option value="">Alle VLANs</option>` + S.vlans.map(v => `<option value="${v.id}">${esc(v.label)}</option>`).join("");

  const q = $("q").value.trim().toLowerCase();
  let list = all.filter(d => curVlan === "all" || String(d.vlan) === String(curVlan));
  if (filter === "on") list = list.filter(d => d.online);
  if (filter === "off") list = list.filter(d => !d.online);
  if (filter === "unnamed") list = list.filter(d => !d.name);
  if (filter === "watch") list = list.filter(d => d.watch);
  if (q) list = list.filter(d => [d.name, d.unifi_name, d.hostname, d.ip, d.mac, d.vendor, d.conn].join(" ").toLowerCase().includes(q));

  const sort = $("sort").value;
  const cmp = {
    ip: (a, b) => ipNum(a.ip) - ipNum(b.ip),
    name: (a, b) => (dname(a) || "~").localeCompare(dname(b) || "~", "de"),
    status: (a, b) => b.online - a.online || ipNum(a.ip) - ipNum(b.ip),
    seen: (a, b) => (b.last_seen || 0) - (a.last_seen || 0),
    first: (a, b) => (b.first_seen || 0) - (a.first_seen || 0),
  }[sort];
  list.sort(cmp);

  let groups;
  if (curVlan === "all" && ["ip", "name", "status"].includes(sort)) {
    groups = S.vlans.map(v => ({v, items: list.filter(d => d.vlan === v.id)})).filter(g => g.items.length);
  } else {
    groups = [{v: null, items: list}];
  }

  $("groups").innerHTML = list.length ? groups.map(g => `
    <div class="group">
      ${g.v ? `<div class="ghead"><h3>${esc(g.v.label)}</h3><span>${g.v.subnet || ""}${g.v.subnet ? " · " : ""}${g.items.filter(d => d.online).length}/${g.items.length} online</span></div>` : ""}
      <div class="list">${g.items.map(rowHtml).join("")}</div>
    </div>`).join("")
    : `<div class="list"><div class="empty">Keine Geräte gefunden</div></div>`;
}

function rowHtml(d) {
  const n = dname(d);
  const sub = [d.name && d.hostname && d.hostname !== d.name ? d.hostname : "", d.vendor].filter(Boolean).join(" · ");
  return `
    <div class="row" onclick="openSheet(${d.id})">
      <span class="dot ${d.online ? "on" : ""}"></span>
      <div class="nm">
        <b class="${n ? "" : "unnamed"}">${esc(n || "Unbekanntes Gerät")}</b>
        <small class="m"><span class="mono">${esc(d.ip)}</span>${busy(d) ? ` · ↓ ${fmtR(d.rx_bps)} ↑ ${fmtR(d.tx_bps)}` : d.vendor ? " · " + esc(d.vendor) : ""}</small>
        <small class="d">${esc(sub || d.mac)}</small>
      </div>
      <span class="ipc mono">${esc(d.ip)}</span>
      <span class="conn">${esc(d.conn || d.interface || "")}</span>
      ${rateHtml(d)}
      <span class="seen">${d.online ? `<span style="color:var(--on)">online</span>` : ago(d.last_seen)}</span>
      <button class="bell ${d.watch ? "on" : ""}" title="Online/Offline per Telegram melden" onclick="event.stopPropagation();toggleWatch(${d.id})">🔔</button>
    </div>`;
}

const busy = d => (d.rx_bps || 0) + (d.tx_bps || 0) >= 1000;
function rateHtml(d) {
  if (!S.traffic || !S.traffic.enabled) return `<span class="rate"></span>`;
  if (!busy(d)) return `<span class="rate idle" title="kein nennenswerter Traffic">–</span>`;
  return `<span class="rate mono ${d.traffic_alert ? "talert" : ""}" title="${d.traffic_alert ? "Traffic-Alarm aktiv · " : ""}Download / Upload (live)">
    <i>↓</i>${fmtR(d.rx_bps)}<br><i>↑</i>${fmtR(d.tx_bps)}</span>`;
}

function selVlan(id) { curVlan = id; localStorage.setItem("nw_vlan", id); render(); }
$("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  [...$("filters").children].forEach(x => x.classList.toggle("active", x === b));
  render();
});

async function toggleWatch(id) {
  const d = S.devices.find(x => x.id === id); if (!d) return;
  d.watch = d.watch ? 0 : 1; render();
  await api("api/devices/" + id, {watch: !!d.watch});
  toast(d.watch ? "🔔 Statuswechsel werden gemeldet" : "Meldungen ausgeschaltet");
}

/* ---------- Detailansicht ---------- */
function openSheet(id) {
  openId = id; refreshSheet(true);
  $("backdrop").classList.add("open"); $("sheet").classList.add("open");
}
function closeSheet() {
  openId = null; $("backdrop").classList.remove("open"); $("sheet").classList.remove("open");
}
function refreshSheet(force) {
  const d = S.devices.find(x => x.id === openId);
  if (!d) return closeSheet();
  if (!force) return; // während offen nicht neu aufbauen (Eingabe nicht stören)
  const v = S.vlans.find(x => x.id === d.vlan);
  $("sheet").innerHTML = `
    <h2><span class="dot ${d.online ? "on" : ""}"></span>${esc(dname(d) || "Unbekanntes Gerät")}</h2>
    <div class="sub">${d.online ? "online" : "offline · zuletzt " + ago(d.last_seen)} · ${esc(v ? v.label : "Andere")}</div>
    <div class="field">
      <label for="nameInput">Name</label>
      <input id="nameInput" value="${esc(d.name)}" placeholder="${esc(d.unifi_name || d.hostname || "z. B. Wohnzimmer TV")}" enterkeyhint="done" autocomplete="off"
             onkeydown="if(event.key==='Enter'){saveName()}">
    </div>
    <dl class="kv">
      <dt>IP</dt><dd class="mono">${esc(d.ip)}</dd>
      <dt>MAC</dt><dd><span class="mono">${esc(d.mac)}</span>${isRnd(d.mac) ? ` <span class="badge" title="Lokal administrierte (zufällige) MAC-Adresse">privat</span>` : ""}</dd>
      ${d.hostname ? `<dt>Hostname</dt><dd>${esc(d.hostname)}</dd>` : ""}
      ${d.unifi_name ? `<dt>UniFi-Name</dt><dd>${esc(d.unifi_name)}</dd>` : ""}
      ${d.vendor ? `<dt>Hersteller</dt><dd>${esc(d.vendor)}</dd>` : ""}
      ${d.conn ? `<dt>Verbindung</dt><dd>${esc(d.conn)}</dd>` : ""}
      ${d.interface ? `<dt>Interface</dt><dd>${esc(d.interface)}</dd>` : ""}
      <dt>Zuerst gesehen</dt><dd>${dt(d.first_seen)}</dd>
      <dt>Zuletzt gesehen</dt><dd>${dt(d.last_seen)}</dd>
    </dl>
    ${S.traffic && S.traffic.enabled ? `
    <div class="tsec">
      <div class="thead"><b>Traffic</b><span class="mono mute" id="sheetRate"></span></div>
      <div class="thead">
        <div class="seg" id="srng">${[["24h","24 h"],["7d","7 Tage"],["30d","30 Tage"]].map(([k, l]) => `<button data-r="${k}" class="${k === srng ? "active" : ""}">${l}</button>`).join("")}</div>
        <div class="legend" id="slegend"></div>
      </div>
      <div id="schart" class="chart"><div class="empty">lädt …</div></div>
      <div class="tsum" id="stsum"></div>
      <div id="stab"></div>
    </div>
    <div class="field" style="margin-top:12px">
      <label for="limitInput">Traffic-Alarm ab MB/s (nur mit 🔔 · leer = Standard${S.traffic.alert_mbs > 0 ? " " + nf1.format(S.traffic.alert_mbs) : ": aus"} · 0 = aus)</label>
      <input id="limitInput" type="text" inputmode="decimal" value="${d.traffic_limit === null || d.traffic_limit === undefined ? "" : nf1.format(d.traffic_limit)}"
             placeholder="${S.traffic.alert_mbs > 0 ? nf1.format(S.traffic.alert_mbs) + " MB/s für " + S.traffic.alert_minutes + " min" : "z. B. 5"}" autocomplete="off"
             onkeydown="if(event.key==='Enter'){saveName()}">
    </div>` : ""}
    <div class="toggle">
      <div><b>Online/Offline melden</b><small>Telegram-Nachricht bei Statuswechsel${S.traffic && S.traffic.enabled ? " und Traffic-Alarm" : ""}</small></div>
      <label class="sw"><input type="checkbox" ${d.watch ? "checked" : ""} onchange="toggleWatch(${d.id})"><span></span></label>
    </div>
    <div class="checkres" id="checkres"></div>
    <div class="actions">
      <button class="btn" onclick="checkNow(${d.id})">Live prüfen</button>
      <button class="btn primary" onclick="saveName()">Speichern</button>
    </div>
    <div class="actions">
      <button class="btn danger" onclick="delDev(${d.id})">Entfernen</button>
      <button class="btn" onclick="closeSheet()">Schließen</button>
    </div>`;
  const sr = $("srng");
  if (sr) {
    sr.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      srng = b.dataset.r; [...sr.children].forEach(x => x.classList.toggle("active", x === b));
      loadDevTraffic(d.id);
    });
    updateSheetRate(); loadDevTraffic(d.id);
  }
}
function updateSheetRate() {
  const el = $("sheetRate"), d = S && S.devices.find(x => x.id === openId);
  if (!el || !d) return;
  el.innerHTML = (d.traffic_alert ? `<span class="talert">⚠ Alarm · </span>` : "") + `live ↓ ${fmtR(d.rx_bps)} · ↑ ${fmtR(d.tx_bps)}`;
}
async function loadDevTraffic(id) {
  try {
    const r = await (await fetch(`api/devices/${id}/traffic?range=${srng}`)).json();
    if (openId !== id || !$("schart")) return;
    const tot = r.series.reduce((a, x) => [a[0] + x.rx, a[1] + x.tx], [0, 0]);
    $("slegend").innerHTML = legendHtml(tot);
    barChart($("schart"), r.series, srng);
    $("stsum").innerHTML = [["today", "Heute"], ["24h", "24 h"], ["7d", "7 Tage"], ["30d", "30 Tage"]].map(([k, l]) =>
      `<div><span>${l}</span>↓ ${fmtB(r.totals[k].rx)}<br>↑ ${fmtB(r.totals[k].tx)}</div>`).join("");
    $("stab").innerHTML = tableHtml(r.series, srng);
  } catch (e) { if ($("schart")) $("schart").innerHTML = `<div class="empty">Traffic konnte nicht geladen werden</div>`; }
}
async function saveName() {
  const d = S.devices.find(x => x.id === openId); if (!d) return;
  const v = $("nameInput").value.trim(), body = {};
  if (v !== d.name) { d.name = v; body.name = v; }
  const li = $("limitInput");
  if (li) {
    const raw = li.value.trim().replace(",", "."), cur = d.traffic_limit ?? null;
    const nv = raw === "" ? null : +raw;
    if (raw !== "" && !(nv >= 0)) { toast("Traffic-Alarm: bitte eine Zahl eingeben"); return; }
    if (nv !== cur) body.traffic_limit = nv;
  }
  if (Object.keys(body).length) {
    const r = await api("api/devices/" + d.id, body);
    toast(r.ok ? "Gespeichert" : "Speichern fehlgeschlagen");
  }
  closeSheet(); load();
}
async function checkNow(id) {
  $("checkres").innerHTML = `<span class="mute">Prüfe …</span>`;
  try {
    const r = await (await api(`api/devices/${id}/check`)).json();
    $("checkres").innerHTML = r.alive
      ? `<span style="color:var(--on)">● antwortet auf Ping (${esc(r.ip)})</span>`
      : `<span style="color:var(--off)">● keine Antwort auf Ping (${esc(r.ip)})</span><br><span class="mute">Manche Geräte (z. B. Handys) blockieren Ping.</span>`;
  } catch (e) { $("checkres").textContent = "Prüfung fehlgeschlagen"; }
}
async function delDev(id) {
  if (!confirm("Gerät entfernen? Ist es weiter im Netz, taucht es beim nächsten Scan als neu auf.")) return;
  await api("api/devices/" + id, null, "DELETE"); closeSheet(); load();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ---------- Ereignisse ---------- */
const KIND = {new:"Neu", online:"Online", offline:"Offline", ipchange:"IP neu", macchange:"MAC neu", vlanchange:"VLAN neu", traffic:"Traffic", info:"Info"};
const isRnd = mac => !!mac && mac.length === 17 && "26ae".includes(mac[1].toLowerCase());
async function loadEvents() {
  try {
    const r = await (await fetch(`api/events?limit=${$("elimit").value}&kind=${encodeURIComponent(ekind)}`)).json();
    E = r.events; $("ecount").textContent = `${r.total} Ereignisse gespeichert`;
    renderEvents();
  } catch (e) {}
}
$("ekinds").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  ekind = b.dataset.k;
  [...$("ekinds").children].forEach(x => x.classList.toggle("active", x === b));
  loadEvents();
});
function dayLabel(ts) {

/* ---------- Traffic-Grafik (gestapelte Balken: Download unten, Upload oben) ---------- */
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
function bucketLabel(ts, rng, long) {
  const d = new Date(ts * 1000), hh = String(d.getHours()).padStart(2, "0");
  const dm = d.toLocaleDateString("de-DE", {day: "2-digit", month: "2-digit"});
  if (rng === "24h") return long ? `${dm} ${hh}:00–${String((d.getHours() + 1) % 24).padStart(2, "0")}:00` : `${hh}:00`;
  if (rng === "7d") return long ? `${WD[d.getDay()]} ${dm} ${hh}–${String(d.getHours() + 6).padStart(2, "0")} Uhr` : `${WD[d.getDay()]} ${d.getDate()}.`;
  return long ? `${WD[d.getDay()]} ${dm}` : dm;
}
function niceStep(v) {
  if (v <= 0) return 250;
  const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function legendHtml(tot) {
  return `<span><i class="sw2 dn"></i>Download <b>${fmtB(tot[0])}</b></span><span><i class="sw2 up"></i>Upload <b>${fmtB(tot[1])}</b></span>`;
}
function tableHtml(series, rng) {
  const rows = series.filter(x => x.rx + x.tx > 0);
  if (!rows.length) return "";
  return `<details class="ttab"><summary>Als Tabelle</summary><table>
    <tr><th>Zeitraum</th><th>↓ Download</th><th>↑ Upload</th></tr>
    ${rows.slice().reverse().map(x => `<tr><td>${bucketLabel(x.ts, rng, true)}</td><td>${fmtB(x.rx)}</td><td>${fmtB(x.tx)}</td></tr>`).join("")}
  </table></details>`;
}
function barChart(el, series, rng) {
  const W = Math.max(260, el.clientWidth || 480), H = 150, L = 50, R = 4, Tp = 8, B = 20;
  const n = series.length, pw = W - L - R, ph = H - Tp - B;
  const step = niceStep(Math.max(...series.map(x => x.rx + x.tx)) / 4), max = step * 4;
  const slot = pw / n, gap = Math.min(4, slot * 0.3), bw = Math.max(1, slot - gap);
  const y = v => Tp + ph - v / max * ph;
  const r = Math.min(4, bw / 2);
  // Balkenkopf oben gerundet, unten an der Grundlinie gerade
  const top = (x, y0, w, h) => h <= 0 ? "" : h <= r
    ? `<rect x="${x}" y="${y0}" width="${w}" height="${h}" rx="${Math.min(r, h / 2)}"/>`
    : `<path d="M${x},${y0 + h}V${y0 + r}Q${x},${y0} ${x + r},${y0}H${x + w - r}Q${x + w},${y0} ${x + w},${y0 + r}V${y0 + h}Z"/>`;
  let grid = "", bars = "", hits = "", xl = "";
  for (let i = 0; i <= 4; i++) {
    const v = step * i, yy = y(v);
    grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 3.5}" text-anchor="end">${i ? fmtB(v) : "0"}</text>`;
  }
  const every = rng === "24h" ? 6 : rng === "7d" ? 4 : 5;
  series.forEach((s, i) => {
    const x = L + i * slot + gap / 2;
    const hd = s.rx / max * ph, hu = s.tx / max * ph, base = Tp + ph;
    const sep = hd > 0 && hu > 0 ? 2 : 0;   // 2px Fuge zwischen den Segmenten
    if (hd > 0) bars += `<g fill="var(--down)">${hu > 0 ? `<rect x="${x}" y="${base - hd}" width="${bw}" height="${hd}"/>` : top(x, base - hd, bw, hd)}</g>`;
    if (hu > 0) bars += `<g fill="var(--up)">${top(x, base - hd - hu - sep, bw, Math.max(hu, 1))}</g>`;
    hits += `<rect class="hit" data-i="${i}" x="${L + i * slot}" y="${Tp}" width="${slot}" height="${ph}"><title>${esc(bucketLabel(s.ts, rng, true))}: ↓ ${fmtB(s.rx)} · ↑ ${fmtB(s.tx)}</title></rect>`;
    if (i % every === 0) xl += `<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${bucketLabel(s.ts, rng)}</text>`;
  });
  const empty = series.every(x => x.rx + x.tx === 0);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Traffic-Verlauf">${grid}${bars}${xl}${hits}
      ${empty ? `<text x="${L + pw / 2}" y="${Tp + ph / 2}" text-anchor="middle">noch keine Daten in diesem Zeitraum</text>` : ""}</svg><div class="tip"></div>`;
  const tip = el.querySelector(".tip");
  el.querySelectorAll(".hit").forEach(h => {
    h.querySelector("title").remove();      // eigener Tooltip statt Browser-Titel
    const show = ev => {
      const s = series[+h.dataset.i], bx = el.getBoundingClientRect();
      tip.innerHTML = `<b>${esc(bucketLabel(s.ts, rng, true))}</b><i class="sw2 dn"></i>↓ ${fmtB(s.rx)}<br><i class="sw2 up"></i>↑ ${fmtB(s.tx)}`;
      tip.style.display = "block";
      const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - bx.left;
      tip.style.left = Math.min(Math.max(0, cx - tip.offsetWidth / 2), bx.width - tip.offsetWidth) + "px";
      tip.style.top = (-tip.offsetHeight - 6 + Tp) + "px";
    };
    h.addEventListener("mousemove", show); h.addEventListener("touchstart", show, {passive: true});
    h.addEventListener("mouseleave", () => tip.style.display = "none");
  });
}

/* automatische Daten + eigene Ergänzungen zusammenführen */
function netGraph() {
  const m = NM, nodes = [], byId = {};
  const hideN = new Set(m.hide_nodes || []), hideE = new Set(m.hide_edges || []);
  for (const a of N.nodes || []) {
    const n = { ...a, auto: true, autoLabel: a.label };
    if (m.names?.[n.id]) n.label = m.names[n.id];
    if (m.kinds?.[n.id]) n.kind = m.kinds[n.id];
    n.note = m.notes?.[n.id] || "";
    n.hidden = hideN.has(n.id);
    byId[n.id] = n; nodes.push(n);
  }
  for (const c of m.nodes || []) {
    const n = { id: c.id, label: c.label || "Gerät", kind: c.kind || "device", ip: c.ip || "", note: c.note || "",
                source: "manual", hidden: hideN.has(c.id) };
    byId[n.id] = n; nodes.push(n);
  }
  const edges = [];
  for (const a of N.edges || []) edges.push({ ...a, auto: true, hidden: hideE.has(a.id) });
  for (const e of m.edges || []) edges.push({ id: e.id, from: e.from, to: e.to, kind: e.kind || "wire", label: e.label || "", manual: true });
  // Container nur als Zahl am Host, wenn ausgeblendet
  const ctCount = {};
  const keep = n => {
    if (n.hidden && !nopt.hidden) return false;
    if (n.kind === "container" && n.auto && !nopt.containers) return false;
    const pinned = NM.pos?.[n.id] || NM.names?.[n.id];
    const detected = n.source === "unifi" || n.source === "netwatch";
    if (detected && CLIENT_KINDS.includes(n.kind) && !nopt.clients && !pinned) return false;
    if (detected && n.status === "down" && !nopt.offline && !pinned) return false;
    return true;
  };
  const vis = nodes.filter(keep), visIds = new Set(vis.map(n => n.id));
  for (const e of edges) if (byId[e.to]?.kind === "container" && !visIds.has(e.to) && visIds.has(e.from)) ctCount[e.from] = (ctCount[e.from] || 0) + 1;
  vis.forEach(n => n.ctCount = ctCount[n.id] || 0);
  const ve = edges.filter(e => visIds.has(e.from) && visIds.has(e.to) && (!e.hidden || nopt.hidden));
  const g = { nodes: vis, edges: ve, byId: Object.fromEntries(vis.map(n => [n.id, n])), all: byId, allEdges: edges };
  g.pos = netLayout(g);
  return g;
}

/* Auto-Layout: Baum von oben nach unten; viele Endgeräte an einem Knoten als Raster */
const ROOT_ORDER = ["internet", "modem", "router", "gateway"];
function netLayout(g) {
  const parent = {}, kids = {};
  for (const e of g.edges) {
    if (parent[e.to] !== undefined || e.from === e.to) continue;
    parent[e.to] = e.from; (kids[e.from] ||= []).push(e.to);
  }
  // Zyklen kappen
  for (const id of Object.keys(parent)) {
    const seen = new Set([id]); let p = parent[id];
    while (p !== undefined) { if (seen.has(p)) { kids[parent[id]] = kids[parent[id]].filter(x => x !== id); delete parent[id]; break; } seen.add(p); p = parent[p]; }
  }
  const rank = n => { const i = ROOT_ORDER.indexOf(n.kind); return i < 0 ? 9 : i; };
  const sortIds = ids => ids.sort((a, b) => {
    const A = g.byId[a], B = g.byId[b];
    return (kids[b]?.length || 0) - (kids[a]?.length || 0) || rank(A) - rank(B) || A.label.localeCompare(B.label, "de");
  });
  const roots = sortIds(g.nodes.filter(n => parent[n.id] === undefined && kids[n.id]?.length).map(n => n.id));
  const lone = g.nodes.filter(n => parent[n.id] === undefined && !kids[n.id]?.length).map(n => n.id);
  const W = {}, pos = {};
  const split = id => {
    const k = sortIds([...(kids[id] || [])]);
    const leaves = k.filter(x => !kids[x]?.length), branches = k.filter(x => kids[x]?.length);
    return { leaves, branches, grid: leaves.length > 5 };
  };
  const cols = n => Math.min(4, Math.ceil(Math.sqrt(n * 1.6)));
  const measure = id => {
    if (W[id] !== undefined) return W[id];
    W[id] = NW;
    const { leaves, branches, grid } = split(id);
    const parts = branches.map(measure);
    if (grid) parts.unshift(cols(leaves.length) * (NW + GX) - GX); else leaves.forEach(() => parts.push(NW));
    const sum = parts.reduce((a, b) => a + b, 0) + Math.max(0, parts.length - 1) * GX;
    return W[id] = Math.max(NW, sum);
  };
  const place = (id, x0, y) => {
    const w = measure(id);
    pos[id] = [x0 + w / 2 - NW / 2, y];
    const { leaves, branches, grid } = split(id);
    const parts = [];
    if (grid) parts.push({ grid: leaves, w: cols(leaves.length) * (NW + GX) - GX });
    else leaves.forEach(l => parts.push({ id: l, w: NW }));
    branches.forEach(b => parts.push({ id: b, w: measure(b) }));
    const total = parts.reduce((a, p) => a + p.w, 0) + Math.max(0, parts.length - 1) * GX;
    let x = x0 + (w - total) / 2;
    for (const p of parts) {
      if (p.grid) {
        const c = cols(p.grid.length);
        p.grid.forEach((l, i) => pos[l] = [x + (i % c) * (NW + GX), y + GY + Math.floor(i / c) * (NH + 24)]);
      } else place(p.id, x, y + GY);
      x += p.w + GX;
    }
  };
  let x = 0;
  for (const r of roots) { place(r, x, 0); x += measure(r) + GX * 3; }
  // Einzelgänger darunter als Raster
  let maxY = 0; Object.values(pos).forEach(p => maxY = Math.max(maxY, p[1]));
  const c = Math.max(4, Math.floor(Math.max(x, 900) / (NW + GX)));
  lone.forEach((id, i) => pos[id] = [(i % c) * (NW + GX), maxY + GY * 1.4 + Math.floor(i / c) * (NH + 18)]);
  // gespeicherte Positionen haben Vorrang
  for (const n of g.nodes) if (NM.pos?.[n.id]) pos[n.id] = NM.pos[n.id];
  return pos;
}

function netMatch(n, q) {
  return !q || [n.label, n.autoLabel, n.ip, n.mac, n.vlan, n.model, n.note, ...(n.ips || []), ...(n.info || [])]
    .some(v => String(v || "").toLowerCase().includes(q));
}

function edgePath(a, b) {
  const ax = a[0] + NW / 2, bx = b[0] + NW / 2;
  if (b[1] >= a[1] + NH + GY && Math.abs(b[0] - a[0]) > 4) {
    // weiter unten (zweite Reihe im Raster): seitlich am Kasten vorbei, nicht durch die Reihe darüber
    const y1 = a[1] + NH, my = y1 + (GY - NH) / 2, tx = b[0] - 11, ym = b[1] + NH / 2;
    return { d: `M${ax},${y1} V${my} H${tx} V${ym} H${b[0]}`, lx: bx, ly: b[1] - 5, anchor: "middle" };
  }
  if (b[1] >= a[1] + NH + 20) {           // Kind unterhalb: rechtwinklig wie ein Schaltplan
    const y1 = a[1] + NH, y2 = b[1], my = y2 - Math.min(26, (y2 - y1) / 2);
    return { d: `M${ax},${y1} V${my} H${bx} V${y2}`, lx: bx, ly: y2 - 6, anchor: "middle" };
  }
  if (a[1] >= b[1] + NH + 20) {
    const y1 = a[1], y2 = b[1] + NH, my = y1 - Math.min(26, (y1 - y2) / 2);
    return { d: `M${ax},${y1} V${my} H${bx} V${y2}`, lx: bx, ly: y2 + 12, anchor: "middle" };
  }
  const left = a[0] < b[0];
  const x1 = left ? a[0] + NW : a[0], x2 = left ? b[0] : b[0] + NW, y1 = a[1] + NH / 2, y2 = b[1] + NH / 2;
  return { d: `M${x1},${y1} L${x2},${y2}`, lx: (x1 + x2) / 2, ly: (y1 + y2) / 2 - 5, anchor: "middle" };
}

function netDraw() {
  if (!N || !NM || !qs("#ng")) return;
  const q = (qs("#nq")?.value || "").trim().toLowerCase();
  G = netGraph();
  const P = G.pos;
  const eh = [], nh = [];
  for (const e of G.edges) {
    const a = P[e.from], b = P[e.to];
    if (!a || !b) continue;
    const p = edgePath(a, b);
    const dim = q && !(netMatch(G.byId[e.from], q) || netMatch(G.byId[e.to], q));
    eh.push(`<g class="ne ${e.kind}${e.manual ? " manual" : ""}${e.hidden ? " hid" : ""}${dim ? " dim" : ""}" data-eid="${esc(e.id)}">
      <path class="l" d="${p.d}"/><path class="hit" d="${p.d}"/>
      ${e.label ? `<text x="${p.lx}" y="${p.ly}" text-anchor="${p.anchor}">${esc(e.label)}</text>` : ""}</g>`);
  }
  for (const n of G.nodes) {
    const [x, y] = P[n.id] || [0, 0];
    const ic = (NK[n.kind] || NK.device)[0];
    const sub = n.ip || n.vlan || (n.info || [])[0] || NK[n.kind]?.[1] || "";
    const lbl = n.label.length > 19 ? n.label.slice(0, 18) + "…" : n.label;
    const cls = ["nn", n.status || "", n.hidden ? "hid" : "", netSel === n.id ? "sel" : "", netConnect === n.id ? "src" : "",
                 q && !netMatch(n, q) ? "dim" : ""].join(" ");
    nh.push(`<g class="${cls}" data-id="${esc(n.id)}" transform="translate(${x},${y})">
      <title>${esc([n.label, n.ip, n.mac, n.vlan, n.note].filter(Boolean).join("\n"))}</title>
      <rect class="b" width="${NW}" height="${NH}" rx="10"/>
      <text class="i" x="12" y="33">${ic}</text>
      <text x="40" y="23">${esc(lbl)}</text>
      <text class="s" x="40" y="40">${esc(sub.length > 22 ? sub.slice(0, 21) + "…" : sub)}</text>
      ${n.status ? `<circle class="st" cx="${NW - 11}" cy="11" r="4"/>` : ""}
      ${n.ctCount ? `<rect class="badge" x="${NW - 40}" y="${NH - 17}" width="32" height="14" rx="7"/><text class="bt" x="${NW - 24}" y="${NH - 7}" text-anchor="middle">🐳${n.ctCount}</text>` : ""}
      ${n.note ? `<text x="${NW - 12}" y="${NH - 8}" font-size="11" text-anchor="end">📝</text>` : ""}</g>`);
  }
  qs("#ng-e").innerHTML = eh.join("");
  qs("#ng-n").innerHTML = nh.join("");
  if (!nv) netFit(); else netApplyView();
  const h = [];
  if (!N.unifi) h.push(`<p class="nhint">Tipp: Mit <code>UNIFI_URL</code>, <code>UNIFI_USER</code> und <code>UNIFI_PASSWORD</code> kommen Switches, APs, Switch-Ports und WLAN automatisch dazu.</p>`);
  (N.warnings || []).forEach(w => h.push(`<p class="nhint w">⚠ ${esc(w)}</p>`));
  if (netConnect) h.push(`<p class="nhint" style="color:var(--accent)">Kabel: jetzt das Zielgerät antippen (Esc bricht ab).</p>`);
  else if (netEdit) h.push(`<p class="nhint">Geräte ziehen zum Verschieben · Gerät antippen für Name/Typ/Notiz · Linie antippen zum Bearbeiten.</p>`);
  qs("#n-hints").innerHTML = h.join("");
  qs("#nwrap").classList.toggle("connect", !!netConnect);
  qs("#n-edit").classList.toggle("on", netEdit);
  qs("#n-edittools").hidden = !netEdit;
  qs("#n-wire").classList.toggle("on", !!netConnect || netWireMode);
}

/* Ansicht (Verschieben/Zoom) */
function netApplyView() { qs("#ng")?.setAttribute("transform", `translate(${nv.x},${nv.y}) scale(${nv.k})`); }
function netSaveView() { ls.set("net.view", JSON.stringify(nv)); }
function netFit() {
  const svg = qs("#nsvg"); if (!svg) return;
  const ps = Object.values(G.pos);
  if (!ps.length) { nv = { x: 20, y: 20, k: 1 }; netApplyView(); return; }
  const minX = Math.min(...ps.map(p => p[0])), minY = Math.min(...ps.map(p => p[1]));
  const maxX = Math.max(...ps.map(p => p[0])) + NW, maxY = Math.max(...ps.map(p => p[1])) + NH;
  const r = svg.getBoundingClientRect(), pad = 30;
  const k = Math.min(1.4, Math.max(0.15, Math.min((r.width - pad * 2) / (maxX - minX), (r.height - pad * 2 - 20) / (maxY - minY))));
  nv = { k, x: (r.width - (maxX - minX) * k) / 2 - minX * k, y: pad - minY * k };
  if (k < 0.5 && r.width < 720) {   // Handy: lesbar zoomen, oberstes Gerät mittig oben
    const top = ps.reduce((a, p) => p[1] < a[1] || (p[1] === a[1] && Math.abs(p[0] - (minX + maxX) / 2) < Math.abs(a[0] - (minX + maxX) / 2)) ? p : a);
    nv = { k: 0.7, x: r.width / 2 - (top[0] + NW / 2) * 0.7, y: pad - top[1] * 0.7 };
  }
  netApplyView(); netSaveView();
}
function netZoom(f, cx, cy) {
  const r = qs("#nsvg").getBoundingClientRect();
  if (cx === undefined) { cx = r.width / 2; cy = r.height / 2; }
  const k = Math.min(3, Math.max(0.1, nv.k * f));
  nv.x = cx - (cx - nv.x) * (k / nv.k); nv.y = cy - (cy - nv.y) * (k / nv.k); nv.k = k;
  netApplyView(); netSaveView();
}
const toWorld = (cx, cy) => { const r = qs("#nsvg").getBoundingClientRect(); return [(cx - r.left - nv.x) / nv.k, (cy - r.top - nv.y) / nv.k]; };

/* Zeiger: Fläche ziehen = verschieben, zwei Finger = zoomen, im Bearbeiten-Modus Geräte ziehen */
const ptrs = new Map();
let nDrag = null, pinch = null, netWireMode = false;
function netDown(e) {
  if (e.button !== undefined && e.button !== 0 && e.pointerType === "mouse") return;
  const svg = qs("#nsvg");
  try { svg.setPointerCapture(e.pointerId); } catch {}
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), k: nv.k };
    nDrag = null; return;
  }
  const node = e.target.closest(".nn"), edge = e.target.closest(".ne");
  nDrag = { x: e.clientX, y: e.clientY, moved: false, node: node?.dataset.id, edge: edge?.dataset.eid, vx: nv.x, vy: nv.y };
  if (nDrag.node && netEdit) { const p = G.pos[nDrag.node]; nDrag.ox = p[0]; nDrag.oy = p[1]; }
}
function netMove(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const r = qs("#nsvg").getBoundingClientRect();
    netZoom((Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d) * pinch.k / nv.k, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
    return;
  }
  if (!nDrag) return;
  const dx = e.clientX - nDrag.x, dy = e.clientY - nDrag.y;
  if (!nDrag.moved && Math.hypot(dx, dy) < 5) return;
  nDrag.moved = true;
  if (nDrag.node && netEdit && !netConnect) {
    const snap = v => Math.round(v / 2) * 2;
    (NM.pos ||= {})[nDrag.node] = [snap(nDrag.ox + dx / nv.k), snap(nDrag.oy + dy / nv.k)];
    if (!netDraw.raf) netDraw.raf = requestAnimationFrame(() => { netDraw.raf = 0; netDraw(); });
  } else {
    qs("#nsvg").classList.add("panning");
    nv.x = nDrag.vx + dx; nv.y = nDrag.vy + dy; netApplyView();
  }
}
function netUp(e) {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  qs("#nsvg")?.classList.remove("panning");
  const d = nDrag; nDrag = null;
  if (!d) return;
  if (d.moved) { if (d.node && netEdit) netSave(); else netSaveView(); return; }
  if (d.node) netClickNode(d.node);
  else if (d.edge) netEdgeDlg(d.edge);
  else if (netConnect) { netConnect = null; netWireMode = false; netDraw(); }
}

function netClickNode(id) {
  if (netConnect || netWireMode) {
    if (!netConnect) { netConnect = id; netDraw(); return; }
    if (netConnect !== id) { const from = netConnect; netConnect = null; netWireMode = false; netEdgeDlg(null, from, id); }
    else { netConnect = null; netWireMode = false; }
    netDraw(); return;
  }
  netSel = id; netDraw(); netNodeDlg(id);
}

let netSaveT;
function netSave(now) {
  clearTimeout(netSaveT);
  netSaveT = setTimeout(async () => {
    try { const r = await api("api/netmap", NM); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "HTTP " + r.status); }
    catch (err) { toast("Netzplan nicht gespeichert: " + err.message); }
  }, now ? 0 : 500);
}

/* Dialoge */
const ndlg = () => qs("#ndlg");
function kindOptions(sel) { return Object.entries(NK).map(([k, v]) => `<option value="${k}"${k === sel ? " selected" : ""}>${v[0]} ${v[1]}</option>`).join(""); }
function netNodeDlg(id) {
  const n = G.all[id] || G.byId[id]; if (!n) return;
  const conns = (G.allEdges || []).filter(e => e.from === id || e.to === id).map(e => {
    const other = G.all[e.from === id ? e.to : e.from];
    return `<li>${e.from === id ? "→" : "←"} ${esc(other?.label || "?")}${e.label ? ` <span style="color:var(--muted)">(${esc(e.label)})</span>` : ""} · ${EK[e.kind] || e.kind}</li>`;
  });
  const kv = [["Typ", (NK[n.kind] || NK.device).join(" ")], ["IP", [n.ip, ...(n.ips || []).filter(x => x !== n.ip)].filter(Boolean).join(", ")],
    ["MAC", n.mac], ["Netz", n.vlan], ["Modell", n.model],
    ["Status", n.status === "up" ? "online" : n.status === "down" ? "offline" : ""],
    ["Quelle", { unifi: "UniFi", netwatch: "erkannt", manual: "selbst angelegt" }[n.source] || n.source]]
    .filter(r => r[1]);
  const manual = n.source === "manual";
  ndlg().innerHTML = `<form method="dialog">
    <h3>${(NK[n.kind] || NK.device)[0]} ${esc(n.label)}</h3>
    <div class="kv">${kv.map(r => `<span>${r[0]}</span><span>${esc(r[1])}</span>`).join("")}</div>
    ${(n.info || []).length ? `<ul>${n.info.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
    ${conns.length ? `<label>Verbindungen</label><ul>${conns.join("")}</ul>` : ""}
    <label>Name${n.auto && n.autoLabel !== n.label ? ` <span style="color:var(--muted)">(automatisch: ${esc(n.autoLabel)})</span>` : ""}</label>
    <input name="label" value="${esc(n.label)}">
    <label>Typ</label><select name="kind">${kindOptions(n.kind)}</select>
    ${manual ? `<label>IP</label><input name="ip" value="${esc(n.ip || "")}">` : ""}
    <label>Notiz</label><textarea name="note" placeholder="z. B. Patchfeld 12, Kabel blau, Raum…">${esc(n.note || "")}</textarea>
    <div class="nrow">
      <button class="btn primary" value="save">Speichern</button>
      <button class="btn" value="wire">⤳ Kabel von hier</button>
      ${n.dev_id ? `<button class="btn" value="details">Details</button>` : ""}
      <button class="btn" value="hide">${n.hidden ? "Einblenden" : "Ausblenden"}</button>
      ${manual ? `<button class="btn danger" value="delete">Löschen</button>` : ""}
      
      <button class="btn" value="cancel" formnovalidate>Schließen</button>
    </div></form>`;
  const f = ndlg().querySelector("form");
  ndlg().onclose = () => {
    const act = ndlg().returnValue; netSel = null;
    if (act === "save") {
      const label = f.label.value.trim(), kind = f.kind.value, note = f.note.value.trim();
      if (manual) {
        const c = NM.nodes.find(x => x.id === id);
        Object.assign(c, { label: label || "Gerät", kind, note, ip: f.ip.value.trim() });
      } else {
        NM.names ||= {}; NM.kinds ||= {}; NM.notes ||= {};
        if (label && label !== n.autoLabel) NM.names[id] = label; else delete NM.names[id];
        if (kind !== (N.nodes.find(x => x.id === id)?.kind)) NM.kinds[id] = kind; else delete NM.kinds[id];
        if (note) NM.notes[id] = note; else delete NM.notes[id];
      }
      netSave(true);
    } else if (act === "wire") {
      netConnect = id;
    } else if (act === "details") {
      openSheet(n.dev_id);
    } else if (act === "hide") {
      NM.hide_nodes ||= [];
      NM.hide_nodes = n.hidden ? NM.hide_nodes.filter(x => x !== id) : [...NM.hide_nodes, id];
      netSave(true);
      if (!n.hidden) toast("Ausgeblendet – „Ausgeblendete“ anhaken zum Zurückholen");
    } else if (act === "delete" && confirm(`„${n.label}“ und seine Kabel löschen?`)) {
      NM.nodes = NM.nodes.filter(x => x.id !== id);
      NM.edges = (NM.edges || []).filter(e => e.from !== id && e.to !== id);
      delete NM.pos?.[id];
      netSave(true);
    }
    netDraw();
  };
  ndlg().returnValue = ""; ndlg().showModal();
}

function netEdgeDlg(eid, from, to) {
  const e = eid ? (G.allEdges || []).find(x => x.id === eid) : { kind: "wire", label: "", manual: true, from, to, isNew: true };
  if (!e) return;
  const A = G.all[e.from], B = G.all[e.to];
  ndlg().innerHTML = `<form method="dialog">
    <h3>${e.isNew ? "Neues Kabel" : e.manual ? "Kabel bearbeiten" : "Verbindung"}</h3>
    <p style="margin:0 0 6px">${esc(A?.label || "?")} → ${esc(B?.label || "?")}</p>
    ${e.manual ? `<label>Art</label><select name="kind">${Object.entries(EK).map(([k, v]) => `<option value="${k}"${k === e.kind ? " selected" : ""}>${v}</option>`).join("")}</select>
      <label>Beschriftung</label><input name="label" value="${esc(e.label || "")}" placeholder="z. B. Port 3 ↔ eth0, Cat7 blau">`
      : `<div class="kv"><span>Art</span><span>${EK[e.kind] || e.kind}</span><span>Info</span><span>${esc(e.label || "–")}</span><span>Quelle</span><span>automatisch</span></div>`}
    <div class="nrow">
      ${e.manual ? `<button class="btn primary" value="save">Speichern</button>` : ""}
      ${e.manual && !e.isNew ? `<button class="btn danger" value="delete">Löschen</button>` : ""}
      ${!e.manual ? `<button class="btn" value="hide">${e.hidden ? "Einblenden" : "Ausblenden"}</button>` : ""}
      <button class="btn" value="cancel" formnovalidate>${e.manual ? "Abbrechen" : "Schließen"}</button>
    </div></form>`;
  const f = ndlg().querySelector("form");
  ndlg().onclose = () => {
    const act = ndlg().returnValue;
    if (act === "save") {
      NM.edges ||= [];
      if (e.isNew) NM.edges.push({ id: "e:" + Math.random().toString(36).slice(2, 10), from: e.from, to: e.to, kind: f.kind.value, label: f.label.value.trim() });
      else Object.assign(NM.edges.find(x => x.id === e.id), { kind: f.kind.value, label: f.label.value.trim() });
      netSave(true);
    } else if (act === "delete") {
      NM.edges = NM.edges.filter(x => x.id !== e.id); netSave(true);
    } else if (act === "hide") {
      NM.hide_edges ||= [];
      NM.hide_edges = e.hidden ? NM.hide_edges.filter(x => x !== e.id) : [...NM.hide_edges, e.id];
      netSave(true);
    }
    netDraw();
  };
  ndlg().returnValue = ""; ndlg().showModal();
}

function netAddDlg() {
  ndlg().innerHTML = `<form method="dialog">
    <h3>Gerät hinzufügen</h3>
    <label>Name</label><input name="label" placeholder="z. B. Vodafone Station, OPNsense, Patchfeld" required>
    <label>Typ</label><select name="kind">${kindOptions("device")}</select>
    <label>IP (optional)</label><input name="ip">
    <label>Notiz (optional)</label><textarea name="note"></textarea>
    <div class="nrow"><button class="btn primary" value="save">Hinzufügen</button>
      <button class="btn" value="cancel" formnovalidate>Abbrechen</button></div></form>`;
  const f = ndlg().querySelector("form");
  ndlg().onclose = () => {
    if (ndlg().returnValue !== "save" || !f.label.value.trim()) return;
    const id = "m:" + Math.random().toString(36).slice(2, 10);
    (NM.nodes ||= []).push({ id, label: f.label.value.trim(), kind: f.kind.value, ip: f.ip.value.trim(), note: f.note.value.trim() });
    const r = qs("#nsvg").getBoundingClientRect();
    const [x, y] = toWorld(r.left + r.width / 2, r.top + r.height / 2);

    netSave(true); netDraw();
    toast("Hinzugefügt – mit „⤳ Kabel ziehen“ verbinden");
  };
  ndlg().returnValue = ""; ndlg().showModal();
}

/* Ereignisse (delegiert, weil #view neu gezeichnet wird) */
qs("#page-net").addEventListener("pointerdown", e => { if (e.target.closest("#nsvg")) netDown(e); });
qs("#page-net").addEventListener("pointermove", e => { if (e.target.closest("#nsvg") || nDrag || pinch) netMove(e); });
qs("#page-net").addEventListener("pointerup", e => netUp(e));
qs("#page-net").addEventListener("pointercancel", e => { ptrs.delete(e.pointerId); pinch = null; nDrag = null; });
qs("#page-net").addEventListener("wheel", e => {
  if (!e.target.closest("#nsvg")) return;
  e.preventDefault();
  const r = qs("#nsvg").getBoundingClientRect();
  netZoom(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
qs("#page-net").addEventListener("click", e => {
  const id = e.target.id;
  if (id === "n-zin") netZoom(1.25);
  else if (id === "n-zout") netZoom(0.8);
  else if (id === "n-fit") netFit();
  else if (id === "n-edit") { netEdit = !netEdit; netConnect = null; netWireMode = false; netDraw(); }
  else if (id === "n-add") netAddDlg();
  else if (id === "n-wire") { netWireMode = !netWireMode; netConnect = null; netDraw(); if (netWireMode) toast("Erst das Startgerät, dann das Ziel antippen"); }
  else if (id === "n-auto") {
    if (confirm("Alle Positionen verwerfen und automatisch anordnen?")) { NM.pos = {}; netSave(true); netDraw(); netFit(); }
  }
});
qs("#page-net").addEventListener("change", e => {
  const id = e.target.id;
  if (id === "n-clients") { nopt.clients = e.target.checked; ls.set("net.clients", nopt.clients ? "1" : "0"); netDraw(); }
  if (id === "n-hid") { nopt.hidden = e.target.checked; netDraw(); }
  if (id === "n-off") { nopt.offline = e.target.checked; ls.set("net.offline", nopt.offline ? "1" : "0"); netDraw(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && page() === "net" && (netConnect || netWireMode)) { netConnect = null; netWireMode = false; netDraw(); }
});

/* ---------- Navigation ---------- */
function page() { return {"#/events": "ev", "#/traffic": "tr", "#/net": "net"}[location.hash] || "dev"; }
function route() {
  const p = page();
  ["dev", "ev", "tr", "net"].forEach(x => $("page-" + x).classList.toggle("hidden", x !== p));
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("active", a.dataset.nav === p));
  if (p === "ev") loadEvents();
  if (p === "tr") loadTraffic();
  if (p === "net") { if (qs("#net") && N) netDraw(); loadNet(true); }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

route();
load();
let tick = 0;
setInterval(() => {
  if (document.hidden) return;
  load(); tick++;
  if (page() === "ev") loadEvents();
  if (page() === "tr" && (trng === "live" || tick % 6 === 0)) loadTraffic();
}, 10000);
</script>
</body>
</html>
